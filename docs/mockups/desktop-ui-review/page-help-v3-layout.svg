<rect x="370" y="132" width="626" height="760" rx="14" fill="#ffffff" stroke="#e2e8ed"/>
<text x="396" y="160" font-size="11" font-weight="400" fill="#586b78" text-anchor="start">本页帮助</text>
<text x="396" y="192" font-size="20" font-weight="600" fill="#172b36" text-anchor="start">运行状态 · 使用说明</text>
<text x="968" y="168" font-size="20" font-weight="400" fill="#586b78" text-anchor="end">×</text>
<text x="396" y="231" font-size="11" font-weight="600" fill="#586b78" text-anchor="start">推荐顺序</text>
<text x="396" y="258" font-size="12" font-weight="400" fill="#172b36" text-anchor="start">1. 已有配置时打开客户端；首次使用先点“配置客户端”。</text>
<text x="396" y="282" font-size="12" font-weight="400" fill="#172b36" text-anchor="start">2. 观察当前请求链路，点选节点查看详情。</text>
<path d="M396 302L970 302" fill="none" stroke="#e2e8ed"/>
<text x="396" y="323" font-size="12" font-weight="600" fill="#172b36" text-anchor="start">配置客户端</text>
<text x="396" y="345" font-size="12" font-weight="400" fill="#586b78" text-anchor="start">选择客户端和模型，沿引导保存接入；可从已配置模型复用。</text>
<path d="M396 366L970 366" fill="none" stroke="#e2e8ed"/>
<text x="396" y="387" font-size="12" font-weight="600" fill="#172b36" text-anchor="start">客户端 / Hub 节点</text>
<text x="396" y="409" font-size="12" font-weight="400" fill="#586b78" text-anchor="start">查看运行、受管配置和本机服务各自的证据。</text>
<text x="396" y="429" font-size="12" font-weight="400" fill="#586b78" text-anchor="start">ChatGPT 执行通道与模型请求分别记录。</text>
<path d="M396 450L970 450" fill="none" stroke="#e2e8ed"/>
<text x="396" y="471" font-size="12" font-weight="600" fill="#172b36" text-anchor="start">模型 / 渠道节点</text>
<text x="396" y="493" font-size="12" font-weight="400" fill="#586b78" text-anchor="start">短节点逐行对应；相关请求按路由列出，渠道直达对应配置。</text>
<path d="M396 514L970 514" fill="none" stroke="#e2e8ed"/>
<text x="396" y="535" font-size="12" font-weight="600" fill="#172b36" text-anchor="start">使用统计</text>
<text x="396" y="557" font-size="12" font-weight="400" fill="#586b78" text-anchor="start">切换到用量和趋势；已结束的请求仍在请求记录中。</text>
<path d="M396 578L970 578" fill="none" stroke="#e2e8ed"/>
<text x="396" y="599" font-size="12" font-weight="600" fill="#172b36" text-anchor="start">演示状态 / 暂停动效</text>
<text x="396" y="621" font-size="12" font-weight="400" fill="#586b78" text-anchor="start">切换本页合成场景；顶部按钮暂停全局动效。</text>
<text x="396" y="641" font-size="12" font-weight="400" fill="#586b78" text-anchor="start">下方聊天、Skill、MCP、Dumpling 摘要进入各自管理页。</text>
<rect x="396" y="673" width="574" height="89" rx="9" fill="#f8fafb"/>
<text x="409" y="697" font-size="11" font-weight="400" fill="#586b78" text-anchor="start">只显示已打开 / 实际在用的客户端和进行中模型、渠道；无人活动时只留 Hub。</text>
<text x="409" y="718" font-size="11" font-weight="400" fill="#586b78" text-anchor="start">绿色运行点不代表调用成功；流动仅表示请求进行中。</text>
<text x="409" y="739" font-size="11" font-weight="400" fill="#586b78" text-anchor="start">普通接入不推定为 ChatGPT，同名模型与渠道仍按端和条目独立。</text>
<text x="396" y="823" font-size="10" font-weight="400" fill="#71828e" text-anchor="start">合成原型 · 关闭说明后继续当前操作</text>
