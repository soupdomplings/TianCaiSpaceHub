# http context. Replace the reserved domain and certificate paths on deployment.
limit_req_zone $binary_remote_addr zone=mobile_registration:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=mobile_login:1m rate=20r/m;
server {
    listen 443 ssl;
    server_name mobile.example.invalid;
    ssl_certificate /etc/ssl/mobile/fullchain.pem;
    ssl_certificate_key /etc/ssl/mobile/key.pem;
    client_max_body_size 7m;
    access_log off;
    limit_req_status 429;
    proxy_read_timeout 50s;
    proxy_send_timeout 50s;
    proxy_buffering off;
    location = /v1/hub/register {
        limit_req zone=mobile_registration burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
    location = /v1/login {
        limit_req zone=mobile_login burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
    location /v1/ { proxy_pass http://127.0.0.1:8080; }
    location / { return 404; }
}
