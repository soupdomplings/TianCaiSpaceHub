# Hub-local library profile; upstream and local changes: SOURCE.md.

[package]
name = "easytier"
description = "A full meshed p2p VPN, connecting all your devices in one network with one command."
homepage = "https://github.com/EasyTier/EasyTier"
repository = "https://github.com/EasyTier/EasyTier"
version = "2.6.4"
edition = "2024"
rust-version = "1.95"
authors = ["kkrainbow"]
keywords = ["vpn", "p2p", "network", "easytier"]
categories = ["network-programming", "command-line-utilities"]
license-file = "LICENSE"
readme = "README.md"
autobins = false

[lib]
name = "easytier"
path = "src/lib.rs"

[dependencies]
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time", "time"] }
derivative = "2.2.0"
derive_more = { version = "2.1.1", features = ["full"] }
indoc = "2.0.7"
regex = "1.8"
paste = "1.0"
thiserror = "1.0"
auto_impl = "1.1.0"
crossbeam = "0.8.4"
arc-swap = "1.7"
time = "0.3"
toml = "0.8.12"
chrono = { version = "0.4.37", features = ["serde"] }
guarden = "0.1"
delegate = "0.13.5"
itertools = "0.14.0"
strum = { version = "0.27.2", features = ["derive"] }
gethostname = "0.5.0"
futures = { version = "0.3", features = ["bilock", "unstable"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7.9", features = ["codec", "net", "io", "rt"] }
async-stream = "0.3.5"
async-trait = "0.1.74"
dashmap = "6.0"
moka = { version = "0.12", features = ["future"] }
timedmap = "=1.0.1"
zerocopy = { version = "0.7.32", features = ["derive", "simd"] }
bytes = "1.5.0"
pin-project-lite = "0.2.13"
atomic_refcell = "0.1.13"
uuid = { version = "1.5.0", features = ["v4", "fast-rng", "macro-diagnostics", "serde"] }
once_cell = "1.18.0"
prost = "0.13.5"
prost-wkt = "0.6"
prost-wkt-types = "0.6"
anyhow = "1.0"
url = { version = "2.5", features = ["serde"] }
percent-encoding = "2.3.1"
idna = "1.0"
byteorder = "1.5.0"
cidr = { version = "0.3.1", features = ["serde"] }
socket2 = { version = "0.5.10", features = ["all"] }
prefix-trie = { version = "0.7.0", features = ["cidr"] }
stun_codec = "0.3.4"
bytecodec = "0.4.15"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
pnet = { version = "0.35.0", default-features = false, features = ["serde"] }
serde_json = "1"
clap = { version = "4.5.30", features = ["string", "unicode", "derive", "wrap_help", "env"] }
async-recursion = "1.0.5"
network-interface = "2.0"
petgraph = "0.8.1"
ordered_hash_map = "0.5.0"
bitflags = "2.5"
aes-gcm = { version = "0.10.3", optional = true }
snow = "0.10.0"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
base64 = "0.22"
atomic-shim = "0.2.0"
smoltcp = { optional = true, default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "proto-ipv4-fragmentation", "fragmentation-buffer-size-8192", "assembler-max-segment-count-16", "reassembly-buffer-size-8192", "reassembly-buffer-count-16", "socket-tcp", "socket-udp", "async"], path = "../../smoltcp" }
parking_lot = { version = "0.12.0" }
wildmatch = "2.3.4"
rust-i18n = "3"
sys-locale = "0.3"
ringbuf = "0.4.5"
async-ringbuf = "0.3.1"
prost-reflect = { version = "0.14.5", default-features = false, features = ["derive"] }
hickory-resolver = "0.25.2"
hickory-proto = "0.25.2"
bon = "3.9.1"
derive_builder = "0.20.2"
humantime-serde = "1.1.1"
multimap = "0.10.1"
version-compare = "0.2.0"
hmac = "0.12.1"
sha2 = "0.10.8"
shellexpand = "3.1.1"
igd-next = { version = "0.17.0", features = ["aio_tokio"] }
natpmp = "0.5.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29.0", features = ["sched", "socket", "ioctl", "net", "fs"] }

[target.'cfg(not(windows))'.dependencies]
pnet = { version = "0.35.0", features = ["serde"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows", target_os = "freebsd"))'.dependencies]
machine-uid = "0.5.3"

[target.'cfg(any(target_os = "linux"))'.dependencies]
netlink-sys = "0.8.7"
netlink-packet-route = "0.21.0"
netlink-packet-core = { version = "0.7.0" }
netlink-packet-utils = "0.5.2"
resolv-conf = "0.7.3"
dbus = { version = "0.9.7", features = ["vendored"] }
which = "7.0.3"

[target.'cfg(windows)'.dependencies]
ipnetwork = "0.20.0"
pnet_packet = { version = "0.35.0", features = ["std"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WindowsFirewall", "Win32_Networking", "Win32_System_Com", "Win32_System_Diagnostics", "Win32_System_Diagnostics_Debug", "Win32_System_Ole", "Win32_System_Variant", "Win32_Networking_WinSock", "Win32_System_IO"] }
encoding = "0.2"
winreg = "0.52"
winapi = { version = "0.3.9", features = ["impl-default"] }

[build-dependencies]
cfg_aliases = "0.2.1"
globwalk = "0.8.1"
regex = "1"
prost-build = "0.13.5"
prost-wkt-build = "0.6"
easytier-rpc-build = { path = "../easytier-rpc-build", features = ["internal-namespace"] }
prost-reflect-build = { version = "0.14.0" }

[dev-dependencies]
serial_test = "3.0.0"
rstest = "0.25.0"
futures-util = "0.3.31"
maplit = "1.0.2"
tempfile = "3.22.0"
ctor = "0.8.0"

[features]
default = ["hub-embedded", "socks5", "aes-gcm"]
hub-embedded = []
smoltcp = ["dep:smoltcp"]
socks5 = ["smoltcp"]
aes-gcm = ["dep:aes-gcm"]
faketcp = []
full = []
jemalloc = []
jemalloc-prof = []
kcp = []
macos-ne = []
magic-dns = []
mimalloc = []
openssl-crypto = []
quic = []
tracing = []
tun = []
websocket = []
wireguard = []
zstd = []

